name: Validate project policy
description: Validate live PR data from its exact trusted base, then queue Slack once per head.
inputs:
  pr_number:
    description: Existing PR to validate
    required: true
  sc_team_read_token:
    description: Read-only organization membership token
    required: true
  slack_app_id:
    description: Slack app setting passed explicitly by the calling workflow
    required: false
    default: ''
runs:
  using: composite
  steps:
  - name: Resolve the live trusted PR base
    id: pr-base
    shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      POLICY_PR_NUMBER: ${{ inputs.pr_number }}
    run: |
      if [[ ! "$POLICY_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
        echo "::error::pr_number must be a positive integer"
        exit 1
      fi
      # A dispatch uses main's SHA, which may differ from an older PR's base.
      # Resolve metadata before checkout; never select the proposed head.
      pr_base="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${POLICY_PR_NUMBER}" \
        --jq '.base | [.repo.full_name, .ref, .sha] | @tsv')"
      IFS=$'\t' read -r base_repo base_ref base_sha <<< "$pr_base"
      if [[ "$base_repo" != "$GITHUB_REPOSITORY" || "$base_ref" != main ||
            "$pr_base" != "$base_repo"$'\t'"$base_ref"$'\t'"$base_sha" ||
            ! "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
        echo "::error::PR must target this repository's main branch with a valid base commit"
        exit 1
      fi
      echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
  - name: Check out trusted base; never PR head
    uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    with:
      ref: ${{ steps.pr-base.outputs.sha }}
      persist-credentials: false
  - uses: ./project_workflow/setup
  - run: python -m project_workflow.validate_pr --publish-status
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SC_TEAM_READ_TOKEN: ${{ inputs.sc_team_read_token }}
      POLICY_PR_NUMBER: ${{ inputs.pr_number }}
    shell: bash
    id: policy
  - name: Queue Slack sync for the validated submission PR
    if: success()
    shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEW_PR: ${{ inputs.pr_number }}
      SLACK_APP_ID: ${{ inputs.slack_app_id }}
      SLACK_REVIEW: ${{ steps.policy.outputs.slack_review }}
    run: |
      set -euo pipefail
      if [[ -z "$SLACK_APP_ID" ]]; then
        echo "Slack sync disabled: SLACK_APP_ID is empty in the calling workflow."
        exit 0
      fi
      case "$SLACK_REVIEW" in
        true) ;;
        false)
          echo "Slack sync not needed: policy validated a PR other than an EP proposal or CPP claim."
          exit 0
          ;;
        *)
          echo "::error::Policy validation did not supply its Slack routing output; no sync was queued."
          exit 1
          ;;
      esac
      if [[ ! "$REVIEW_PR" =~ ^[1-9][0-9]*$ ]]; then
        echo "::error::Invalid review PR number"
        exit 1
      fi
      pr_info="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${REVIEW_PR}" \
        --jq '[.head.sha, .user.id, .head.ref, .state] | @tsv')"
      IFS=$'\t' read -r head_sha author_id head_ref pr_state <<< "$pr_info"
      if [[ "$author_id" != 41898282 || "$head_ref" != project-submissions/issue-* || "$pr_state" != open ]]; then
        echo "No Slack submission sync needed for this PR."
        exit 0
      fi
      if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
        echo "::error::Invalid proposal head SHA"
        exit 1
      fi
      states="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/status" \
        --jq '[([.statuses[] | select(.context == "Project policy")][0].state // "missing"), ([.statuses[] | select(.context == "PIT Slack sync queued")][0].state // "missing")] | @tsv')"
      IFS=$'\t' read -r policy_state queued_state <<< "$states"
      if [[ "$policy_state" != success ]]; then
        echo "::error::Current proposal head has not passed Project policy"
        exit 1
      fi
      if [[ "$queued_state" == success ]]; then
        echo "Slack sync already requested for this proposal head."
        exit 0
      fi
      gh workflow run slack.yml --repo "$GITHUB_REPOSITORY" --ref main \
        -f operation=sync -f "pr_number=$REVIEW_PR"
      # The shared submission/policy queue serializes this per-head receipt.
      # This marks dispatch, not Slack delivery; failed delivery can always
      # be retried with Slack project review's permanent manual sync option.
      gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
        -f state=success -f 'context=PIT Slack sync queued' \
        -f 'description=Slack synchronization requested for this proposal head' \
        -f "target_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > /dev/null
