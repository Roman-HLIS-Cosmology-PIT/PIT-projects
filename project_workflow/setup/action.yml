name: Set up project registry
description: Shared Python version and dependency installation for trusted registry workflows
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
    - run: python -m pip install -r project_workflow/requirements.txt
      shell: bash
