name: Set up project registry
description: Shared Python version and dependency installation for trusted registry workflows
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      if: env.PIT_PYTHON_REQUIREMENTS != hashFiles('project_workflow/requirements.txt')
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: project_workflow/requirements.txt
    - name: Install dependencies once per requirements version in this job
      if: env.PIT_PYTHON_REQUIREMENTS != hashFiles('project_workflow/requirements.txt')
      run: |
        python -m pip install -r project_workflow/requirements.txt
        echo "PIT_PYTHON_REQUIREMENTS=$REQUIREMENTS_HASH" >> "$GITHUB_ENV"
      shell: bash
      env:
        REQUIREMENTS_HASH: ${{ hashFiles('project_workflow/requirements.txt') }}
