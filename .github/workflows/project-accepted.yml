name: Record project acceptance

on:
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Original merged project-creation PR number (also supports backfilling earlier merges)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  statuses: write
  actions: write

concurrency:
  group: project-acceptance-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  record-acceptance:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.merged == true &&
       !startsWith(github.event.pull_request.head.ref, 'project-acceptances/pr-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted main only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install trusted dependencies
        run: python -m pip install -r requirements.txt
      - name: Create or refresh acceptance metadata PR
        run: python -m scripts.acceptance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SC_TEAM_READ_TOKEN: ${{ secrets.SC_TEAM_READ_TOKEN }}
          ACCEPTANCE_PR_NUMBER: ${{ inputs.pr_number }}
