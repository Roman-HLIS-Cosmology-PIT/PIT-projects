name: Slack project review

on:
  workflow_run:
    workflows: [Project workflows]
    types: [completed]
  schedule:
    - cron: '0 0 * * *' # Midnight UTC; GitHub schedules can be delayed.
  workflow_dispatch:
    inputs:
      operation:
        description: Sync messages only, or check votes and apply decisions
        type: choice
        options: [check, sync]
        default: check
      pr_number:
        description: Optional review PR number; leave blank to check all projects
        type: string
        required: false

permissions: {}

jobs:
  review:
    if: >-
      vars.SLACK_APP_ID != '' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    concurrency:
      group: project-submission-and-policy
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted main, never the triggering PR or its artifacts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: ./project_workflow/setup
      - name: Install pinned Slack CLI (datastore access only; never deploys)
        run: bash slack/install-cli.sh
      - name: Synchronize and optionally check decisions
        run: python -m slack.bridge "$OPERATION" --pr "$REVIEW_PR"
        env:
          OPERATION: ${{ github.event_name == 'workflow_run' && 'sync' || inputs.operation || 'check' }}
          REVIEW_PR: ${{ inputs.pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
          SC_TEAM_READ_TOKEN: ${{ secrets.SC_TEAM_READ_TOKEN }}
          SLACK_APP_ID: ${{ vars.SLACK_APP_ID }}
          SLACK_TEAM_ID: ${{ vars.SLACK_TEAM_ID }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_TEST_BUTTONS: ${{ vars.SLACK_TEST_BUTTONS }}
          SLACK_SERVICE_TOKEN: ${{ secrets.SLACK_SERVICE_TOKEN }}
          SLACK_SYNC_WEBHOOK: ${{ secrets.SLACK_SYNC_WEBHOOK }}
