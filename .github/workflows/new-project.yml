name: New project submission

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled, closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Existing New Project Issue number to revalidate'
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  actions: write

concurrency:
  group: project-submission-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  submit-project:
    # Ordinary Issues skip all processing. A removed submission label still
    # invalidates its PR. Labels route requests; they never authenticate users.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.issue.labels.*.name, 'new-project') ||
       github.event.label.name == 'new-project')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out accepted code only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate submission and create or update its PR
        run: python -m scripts.issue_intake
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SC_TEAM_READ_TOKEN: ${{ secrets.SC_TEAM_READ_TOKEN }}
          SUBMISSION_ISSUE_NUMBER: ${{ inputs.issue_number }}
