name: Project workflows

on:
  issues:
    # Forms apply one submission label at creation. Listening to both opened
    # and labeled processes the same proposal twice.
    types: [edited, reopened, labeled, unlabeled, closed]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, closed]
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to retry using accepted main code
        required: true
        type: choice
        options: [validate, submit]
        default: validate
      issue_number:
        description: Issue number for submit
        required: false
        type: string
      pr_number:
        description: PR number for validate
        required: false
        type: string

permissions: {}

jobs:
  submit:
    name: Project submission
    if: >-
      (github.event_name == 'issues' && !github.event.issue.pull_request &&
       (github.event.action != 'labeled' && github.event.action != 'unlabeled' ||
        github.event.label.name == 'new-project' || github.event.label.name == 'new-cpp-project' ||
        github.event.label.name == 'claim-cpp') &&
       (github.event.action == 'closed' ||
        contains(github.event.issue.labels.*.name, 'new-project') ||
        contains(github.event.issue.labels.*.name, 'new-cpp-project') ||
        contains(github.event.issue.labels.*.name, 'claim-cpp') ||
        github.event.label.name == 'new-project' || github.event.label.name == 'new-cpp-project' ||
        github.event.label.name == 'claim-cpp')) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
       (contains(github.event.issue.labels.*.name, 'new-project') ||
        contains(github.event.issue.labels.*.name, 'new-cpp-project') ||
        contains(github.event.issue.labels.*.name, 'claim-cpp')) &&
       (github.event.action != 'created' || startsWith(github.event.comment.body, '/'))) ||
      (github.event_name == 'pull_request_target' &&
       (github.event.action == 'reopened' ||
        (github.event.action == 'closed' && !github.event.pull_request.merged)) &&
       github.event.pull_request.user.id == 41898282 &&
       startsWith(github.event.pull_request.head.ref, 'project-submissions/issue-')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'submit')
    outputs:
      pr_number: ${{ steps.submission.outputs.pr_number }}
      slack_review: ${{ steps.submission.outputs.slack_review }}
    concurrency:
      group: project-submission-and-policy
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: ./project_workflow/setup
      - id: submission
        run: python -m project_workflow.issue_intake
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SC_TEAM_READ_TOKEN: ${{ secrets.SC_TEAM_READ_TOKEN }}
          SUBMISSION_ISSUE_NUMBER: ${{ inputs.issue_number }}
          POLICY_INLINE: 'true'

  notify:
    name: Slack delivery after successful submission
    needs: submit
    if: >-
      needs.submit.outputs.pr_number != '' &&
      (needs.submit.outputs.slack_review == 'true' || needs.submit.outputs.slack_review == 'false')
    concurrency:
      group: project-submission-and-policy
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      statuses: write
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Queue delivery for the prevalidated submission
        uses: ./project_workflow/policy
        with:
          pr_number: ${{ needs.submit.outputs.pr_number }}
          sc_team_read_token: ${{ secrets.SC_TEAM_READ_TOKEN }}
          slack_app_id: ${{ vars.SLACK_APP_ID }}
          prevalidated_review: ${{ needs.submit.outputs.slack_review || 'missing' }}

  validate:
    name: Validate project policy
    # Reopened submission PRs are repaired and checked by submit. PR prose does
    # not affect policy; an edited base does. No separate maintenance PR run.
    if: >-
      (github.event_name == 'pull_request_target' && github.event.action != 'closed' &&
       (github.event.action != 'edited' || github.event.changes.base) &&
       !(github.event.action == 'reopened' && github.event.pull_request.user.id == 41898282 &&
         startsWith(github.event.pull_request.head.ref, 'project-submissions/issue-'))) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'validate')
    concurrency:
      group: project-submission-and-policy
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write # The narrowly scoped generator may append native outputs to an SC PR.
      pull-requests: write
      issues: read
      statuses: write
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted main for generation; never PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: ./project_workflow/setup
      - name: Refresh generated files before checking the live PR head
        shell: bash
        run: |
          if [[ ! "$GENERATION_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be a positive integer"
            exit 1
          fi
          python -m project_workflow.sync_generated
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SC_TEAM_READ_TOKEN: ${{ secrets.SC_TEAM_READ_TOKEN }}
          GENERATION_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          POLICY_INLINE: 'true'
      - uses: ./project_workflow/policy
        with:
          pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
          sc_team_read_token: ${{ secrets.SC_TEAM_READ_TOKEN }}
          slack_app_id: ${{ vars.SLACK_APP_ID }}
