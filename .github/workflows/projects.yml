name: Project workflows

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled, closed]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to retry using accepted main code
        required: true
        type: choice
        options: [validate, submit]
        default: validate
      issue_number:
        description: Issue number for submit
        required: false
        type: string
      pr_number:
        description: PR number for validate
        required: false
        type: string

permissions: {}

jobs:
  submit:
    name: Project submission
    if: >-
      (github.event_name == 'issues' &&
       (github.event.action == 'closed' ||
        contains(github.event.issue.labels.*.name, 'new-project') ||
        contains(github.event.issue.labels.*.name, 'new-cpp-project') ||
        contains(github.event.issue.labels.*.name, 'claim-cpp') ||
        github.event.label.name == 'new-project' || github.event.label.name == 'new-cpp-project' ||
        github.event.label.name == 'claim-cpp')) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
       (contains(github.event.issue.labels.*.name, 'new-project') ||
        contains(github.event.issue.labels.*.name, 'new-cpp-project') ||
        contains(github.event.issue.labels.*.name, 'claim-cpp')) &&
       (github.event.action != 'created' || startsWith(github.event.comment.body, '/'))) ||
      (github.event_name == 'pull_request_target' && github.event.action == 'reopened' &&
       github.event.pull_request.user.id == 41898282 &&
       startsWith(github.event.pull_request.head.ref, 'project-submissions/issue-')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'submit')
    concurrency:
      group: project-submission-and-policy
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: ./project_workflow/setup
      - run: python -m project_workflow.issue_intake
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SC_TEAM_READ_TOKEN: ${{ secrets.SC_TEAM_READ_TOKEN }}
          SUBMISSION_ISSUE_NUMBER: ${{ inputs.issue_number }}

  validate:
    name: Validate project policy
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'validate')
    concurrency:
      group: project-submission-and-policy
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted base; never PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: ./project_workflow/setup
      - run: python -m project_workflow.validate_pr --publish-status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SC_TEAM_READ_TOKEN: ${{ secrets.SC_TEAM_READ_TOKEN }}
          POLICY_PR_NUMBER: ${{ inputs.pr_number }}
