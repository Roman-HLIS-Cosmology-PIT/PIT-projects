name: Project maintenance

on:
  schedule:
    - cron: '17 0 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional SC PR to regenerate; leave empty to maintain main
        required: false
        type: string

permissions: {}

jobs:
  generate:
    name: Generate GitHub project files
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    concurrency:
      group: project-submission-and-policy
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write # Ensure the generated update form's label exists.
      statuses: write
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted main; proposed files are read as data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: ./project_workflow/setup
      - name: Ensure the automatic update form label exists
        if: inputs.pr_number == ''
        run: python -m project_workflow.updates --ensure-label
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assign permanent numbers only to accepted projects
        if: inputs.pr_number == ''
        run: python -m project_workflow.accepted
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_DATA_TOKEN: ${{ secrets.PROJECT_DATA_TOKEN }}
      - name: Reload numbered main for generated claim choices
        if: inputs.pr_number == ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - run: python -m project_workflow.sync_generated
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SC_TEAM_READ_TOKEN: ${{ secrets.SC_TEAM_READ_TOKEN }}
          GENERATION_PR_NUMBER: ${{ inputs.pr_number }}

      - name: Reload accepted main after generation
        if: inputs.pr_number == ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Validate and export the accepted registry
        if: inputs.pr_number == ''
        run: python -m project_workflow.project_registry export --output-dir build
      - name: Check live SC team access
        if: inputs.pr_number == ''
        run: python -m project_workflow.validate_pr --check-team
        env:
          SC_TEAM_READ_TOKEN: ${{ secrets.SC_TEAM_READ_TOKEN }}
      - name: Generate accepted project wiki and repository issue snapshots
        if: inputs.pr_number == ''
        run: python -m project_workflow.wiki --fetch-issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish the generated wiki
        if: inputs.pr_number == ''
        run: |
          if [ -z "$WIKI_WRITE_TOKEN" ]; then
            echo '::warning::Set WIKI_WRITE_TOKEN and create the initial wiki page to enable publication. Generated pages are in the registry-catalogues artifact.'
          else
            python -m project_workflow.wiki --publish-only
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WIKI_WRITE_TOKEN: ${{ secrets.WIKI_WRITE_TOKEN }}
      - name: Downloadable catalogue exports
        if: always() && inputs.pr_number == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-catalogues
          path: build/
          if-no-files-found: error
          retention-days: 30
