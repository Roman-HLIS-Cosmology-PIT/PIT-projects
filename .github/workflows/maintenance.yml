name: Project maintenance

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional SC PR to regenerate; leave empty to maintain main
        required: false
        type: string

permissions: {}

jobs:
  generate:
    name: Generate GitHub project files
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    concurrency:
      group: project-submission-and-policy
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: read
      statuses: write
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted main; proposed files are read as data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: ./project_workflow/setup
      - run: python -m project_workflow.sync_generated
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SC_TEAM_READ_TOKEN: ${{ secrets.SC_TEAM_READ_TOKEN }}
          GENERATION_PR_NUMBER: ${{ inputs.pr_number }}

      - name: Reload accepted main after generation
        if: inputs.pr_number == ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Validate and export the accepted registry
        if: inputs.pr_number == ''
        run: python -m project_workflow.project_registry export --output-dir build
      - name: Check live SC team access
        if: inputs.pr_number == ''
        run: python -m project_workflow.validate_pr --check-team
        env:
          SC_TEAM_READ_TOKEN: ${{ secrets.SC_TEAM_READ_TOKEN }}
      - name: Downloadable catalogue exports
        if: inputs.pr_number == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-catalogues
          path: build/
          if-no-files-found: error
          retention-days: 30
