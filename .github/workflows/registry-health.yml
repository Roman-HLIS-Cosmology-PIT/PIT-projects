name: Registry health

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-health:
    name: Registry health
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m scripts.project_registry validate
      - name: Check configured SC team access
        run: python -m scripts.validate_pr --check-team
        env:
          SC_TEAM_READ_TOKEN: ${{ secrets.SC_TEAM_READ_TOKEN }}
      - run: python -m unittest discover -s tests -v
      - name: Verify the machine-readable catalogue can be built
        run: python -m scripts.project_registry catalog --output build/projects.json
      - name: Verify the combined working-group YAML can be built
        run: python -m scripts.project_registry working-groups --output build/working_groups.yaml

