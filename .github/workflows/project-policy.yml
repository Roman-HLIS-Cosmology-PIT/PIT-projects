name: Project review

# Trusted-base validation: NEVER check out or execute the PR head. The only
# write is a Project policy commit status on the actual proposed head SHA.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to validate using trusted main code'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

concurrency:
  group: project-policy-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  project-policy:
    # Different from the required status context; do not require a main-SHA
    # workflow_dispatch check run as though it were attached to the PR head.
    name: Validate project policy
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted base only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install trusted-base dependencies
        run: python -m pip install -r requirements.txt
      - name: Run trusted-base policy regression tests
        run: python -m unittest discover -s tests -v
      - name: Check proposed data and original requester authority
        run: python -m scripts.validate_pr --publish-status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SC_TEAM_READ_TOKEN: ${{ secrets.SC_TEAM_READ_TOKEN }}
          POLICY_PR_NUMBER: ${{ inputs.pr_number }}
