name: Project review

# Read-only trusted-base validation: NEVER check out or execute the PR head.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: project-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  project-policy:
    name: Project policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted base only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install trusted-base dependencies
        run: python -m pip install -r requirements.txt
      - name: Check proposed data and SC authority
        run: python -m scripts.validate_pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SC_TEAM_READ_TOKEN: ${{ secrets.SC_TEAM_READ_TOKEN }}
      - name: Run trusted-base policy regression tests
        run: python -m unittest discover -s tests -v
