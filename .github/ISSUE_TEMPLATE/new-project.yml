# Generated by python -m scripts.issue_form; edit working_groups/ instead.
name: New Project
description: Propose a project for Steering Committee review.
title: '[New project] '
labels:
- new-project
body:
- type: markdown
  attributes:
    value: Submit collaboration-appropriate information only. All answers are visible to repository readers. Ordinary
      members can propose EP projects with themselves as lead. Only SC members can declare CPP or KEY. After submission,
      validation will comment here. To correct errors, edit this Issue's description, keep the field headings, and
      save. No email address is requested.
- type: input
  id: name
  attributes:
    label: Project title
    placeholder: A short, descriptive project title
  validations:
    required: true
- type: dropdown
  id: kind
  attributes:
    label: Project kind
    options:
    - EP
    - CPP
    - KEY
    default: 0
  validations:
    required: true
- type: input
  id: lead
  attributes:
    label: Project lead name
    description: Required for EP. SC may leave both lead fields blank for an unassigned CPP/KEY.
  validations:
    required: false
- type: input
  id: lead_github_username
  attributes:
    label: Project lead GitHub username
    description: One GitHub username without @. Ordinary members must enter their own username.
  validations:
    required: false
- type: textarea
  id: contributors
  attributes:
    label: Contributors
    description: Optional. One Name | github_username pair per line; omit the lead.
    placeholder: 'Bob Example | bob-example

      Carol Example | carol-example'
    render: text
  validations:
    required: false
- type: dropdown
  id: working_group
  attributes:
    label: Working group
    options:
    - CAS
    - CPIP
    - SCM
    description: 'CAS: CAS working group; CPIP: CPIP working group; SCM: Shape and Color Measurement'
  validations:
    required: true
- type: dropdown
  id: deliverable_ids
  attributes:
    label: Deliverables
    options:
    - CAS / CAS-1
    - CAS / CAS-2
    - CAS / CAS-3
    - CAS / CAS-4
    - CAS / CAS-5
    - CAS / CAS-6
    - CPIP / CPI-1
    - CPIP / CPI-2
    - CPIP / CPI-3
    - CPIP / CPI-4
    - CPIP / CPI-5
    - CPIP / CPI-6
    - CPIP / CPI-7
    - CPIP / CPI-8
    - SCM / SCM-1
    - SCM / SCM-2
    - SCM / SCM-3
    - SCM / SCM-4
    - SCM / SCM-5
    multiple: true
    description: 'Select only deliverables from your working group. CAS / CAS-1: Photometric redshift inference;
      CAS / CAS-2: Galaxy sample preparation and calibration; CAS / CAS-3: Galaxy cluster identification and cross-correlation;
      CAS / CAS-4: Catalog simulations; CAS / CAS-5: 2-point statistics measurement; CAS / CAS-6: Observational
      systematics parametrizatin and priors; CPIP / CPI-1: 3x2pt and cluster cosmology; CPIP / CPI-2: Baryon suppression
      and nonlinear power spectrum modeling; CPIP / CPI-3: Intrinsic alignements modeling; CPIP / CPI-4: Galaxy
      bias modeling; CPIP / CPI-5: Cluster systematics; CPIP / CPI-6: Data challenges and covariance; CPIP / CPI-7:
      Mass mapping and high-order statistics; CPIP / CPI-8: Forecasting HLIS performance; SCM / SCM-1: Calibration;
      SCM / SCM-2: Image pre-processing; SCM / SCM-3: Galaxy identification and shape measurement; SCM / SCM-4:
      Photometry and color measurement; SCM / SCM-5: Image simulations'
  validations:
    required: true
- type: dropdown
  id: phd_thesis
  attributes:
    label: Part of your PhD thesis?
    options:
    - 'Yes'
    - 'No'
  validations:
    required: true
- type: input
  id: slack_channel
  attributes:
    label: Slack channel
    description: 'Optional existing channel name, such as #scm-shapes. Can be added later.'
  validations:
    required: false
- type: textarea
  id: summary
  attributes:
    label: Description
    description: Describe the goals, approach and expected results. Markdown is supported.
  validations:
    required: true
- type: input
  id: github_url
  attributes:
    label: Main GitHub repository
    description: Optional https://github.com/OWNER/REPOSITORY URL. Accessible repositories are checked; private/inaccessible
      ones are flagged for review.
  validations:
    required: false
- type: textarea
  id: related_links
  attributes:
    label: Related links
    description: Optional. One HTTPS URL per line. Do not include credentials or secret sharing tokens.
    render: text
  validations:
    required: false
