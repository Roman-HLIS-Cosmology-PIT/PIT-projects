# Generated from project_workflow/config.yaml and working_groups/; do not edit this output.
name: New Project
description: Propose a project for review.
labels:
- new-project
body:
- type: markdown
  attributes:
    value: Use **Add a title** above for your project title. Submit collaboration-appropriate information only;
      all answers are visible to repository readers. Ordinary members may propose EP projects with themselves as
      lead. Only SC members may declare CPP or KEY. After submission, a validation result will appear as a comment.
      To correct errors, use the replacement-form link provided in the validation comment. To edit a valid proposal
      before its PR is merged, comment /edit on the latest submission Issue. No email address is requested.
- type: dropdown
  id: kind
  attributes:
    label: Project kind
    default: 0
    options:
    - EP - Enhancing Project
    - CPP - Critical Path Project
    - KEY - Key Project
  validations:
    required: true
- type: input
  id: lead
  attributes:
    label: Project lead name
    description: Required for EP.
  validations:
    required: false
- type: input
  id: lead_github_username
  attributes:
    label: Project lead GitHub username
    description: One GitHub username without @.
  validations:
    required: false
- type: dropdown
  id: working_group
  attributes:
    label: Working group
    options:
    - CAS — Catalogue And Statistics
    - CPIP — Cosmological Parameter Inference Pipeline
    - SCM — Shape and Color Measurement
  validations:
    required: true
- type: dropdown
  id: deliverable_ids
  attributes:
    label: Deliverables
    multiple: true
    description: Select deliverables from your chosen working group.
    options:
    - CAS / CAS-1 — Photometric redshift inference
    - CAS / CAS-2 — Galaxy sample preparation and calibration
    - CAS / CAS-3 — Galaxy cluster identification and cross-correlation
    - CAS / CAS-4 — Catalog simulations
    - CAS / CAS-5 — 2-point statistics measurement
    - CAS / CAS-6 — Observational systematics parametrizatin and priors
    - CPIP / CPI-1 — 3x2pt and cluster cosmology
    - CPIP / CPI-2 — Baryon suppression and nonlinear power spectrum modeling
    - CPIP / CPI-3 — Intrinsic alignements modeling
    - CPIP / CPI-4 — Galaxy bias modeling
    - CPIP / CPI-5 — Cluster systematics
    - CPIP / CPI-6 — Data challenges and covariance
    - CPIP / CPI-7 — Mass mapping and high-order statistics
    - CPIP / CPI-8 — Forecasting HLIS performance
    - SCM / SCM-1 — Calibration
    - SCM / SCM-2 — Image pre-processing
    - SCM / SCM-3 — Galaxy identification and shape measurement
    - SCM / SCM-4 — Photometry and color measurement
    - SCM / SCM-5 — Image simulations
  validations:
    required: true
- type: dropdown
  id: phd_thesis
  attributes:
    label: Part of your PhD thesis?
    options:
    - 'False'
    - 'True'
    default: 0
  validations:
    required: true
- type: input
  id: slack_channel
  attributes:
    label: Slack channel
    description: 'Optional existing channel name, such as #scm-shapes. Can be added later.'
  validations:
    required: false
- type: textarea
  id: summary
  attributes:
    label: Description
    description: Describe the goals, approach and expected results. Markdown is supported.
  validations:
    required: true
- type: input
  id: github_url
  attributes:
    label: Main GitHub repository
    description: Optional https://github.com/OWNER/REPOSITORY URL. Accessible repositories are checked; private/inaccessible
      ones are flagged for review.
  validations:
    required: false
- type: textarea
  id: related_links
  attributes:
    label: Related links
    description: Optional. One HTTPS URL per line. Do not include credentials or secret sharing tokens.
  validations:
    required: false
- type: markdown
  attributes:
    value: '## Contributors


      List up to five contributors, excluding the project lead. Leave unused contributor sections blank. Additional
      contributors can be added to the project later.'
