summary: 'This project will demonstrate the capability of our implementation of metadetection
  on IMCOM coadds. There will be 2 main goals: validate our implementation of metadetection
  and validate IMCOM coadds as input images for shape measurement. Due to lack of
  support of python packages originally developed for DES for the duration of the
  Roman mission, the challenge in adding Roman-specific features to the existing implementation
  and to prepare the future development of MetaCoaddition, we have decided to make
  our own customizable implementation of MetaDetection. The first part of the project
  will consist of preliminary work to validate the method through basic comparison
  tests with the DES/LSST version of metadetection to validate our work and complementary
  tests on simple simulations. The second and main part of the project, which is Roman
  focused, will attempt to validate the IMCOM coadds as reliable input images for
  shear measurement. We will use the existing 5deg2 simulation (and any new run before
  the paper is published). The test will focus on the simulated layers with grid simulation
  to test over-sampling, PSF gaussianization and impact of IMCOM noise properties.
  We will complement the test by the processing of the “science layer” to provide
  preliminary numbers on what to expect with future Roman observations: galaxy density,
  shape noise, additive bias, B-modes, etc.'
