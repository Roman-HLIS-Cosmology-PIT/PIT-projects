# Short codes are used in records; full labels live in the schema descriptions.
# Adding a kind requires explicitly declaring its creation and claim rules here.
kinds:
  EP:
    member_can_create: true
    member_can_claim: false
    allow_unassigned: false
  CPP:
    member_can_create: false
    member_can_claim: true
    allow_unassigned: true
  KEY:
    member_can_create: false
    member_can_claim: false
    allow_unassigned: true

# A lead may update these fields and manage contributors.
lead_editable_fields:
  - lead
  - name
  - summary
  - status
  - working_group
  - deliverable_ids
  - github_url
  - contributors

# Contributors may edit content, but cannot change project membership.
contributor_editable_fields:
  - summary
  - status
  - deliverable_ids
  - github_url
